[package]
name = "price-pulse"
version = "0.1.1"
edition = "2021"
description = "T3N TEE contract: public spot-price lookup via host:interfaces/http. No secrets, no PII, no kv-store writes — deliberately the smallest capability surface (tenant-context + logging + http)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
